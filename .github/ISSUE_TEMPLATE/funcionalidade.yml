name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria para o Portal Brenner
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade da Brenner Soluções isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O colaborador consegue...
        - [ ] O sistema impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [api, web, infra/nas, pipeline/ci-cd]
    validations:
      required: true
